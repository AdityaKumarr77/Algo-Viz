<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoViz Studio — Interactive Algorithm Visualizer</title>
    <meta
      name="description"
      content="AlgoViz Studio — High-performance interactive visualizer for sorting, searching, and pathfinding algorithms with real-time telemetry, audio synthesis, and Big-O complexity analysis."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2300F0FF'/%3E%3Cstop offset='50%25' stop-color='%238B5CF6'/%3E%3Cstop offset='100%25' stop-color='%23F43F5E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='18' width='5' height='12' rx='2.5' fill='url(%23g)'/%3E%3Crect x='10' y='11' width='5' height='19' rx='2.5' fill='url(%23g)'/%3E%3Crect x='18' y='4' width='5' height='26' rx='2.5' fill='url(%23g)'/%3E%3Crect x='26' y='14' width='5' height='16' rx='2.5' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem("algoviz-theme") || 
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-theme="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
